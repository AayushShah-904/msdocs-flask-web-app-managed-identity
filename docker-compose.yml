version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: dbpass
      POSTGRES_DB: restaurant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DBHOST=db
      - DBNAME=restaurant
      - DBUSER=dbuser
      - DBPASS=dbpass
      - SECRET_KEY=some-local-dev-secret-key
    depends_on:
      - db

volumes:
  postgres_data:
